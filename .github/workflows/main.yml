
name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Verify project structure
      - name: Check project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "main.py",
            "requirements.txt",
            "gui/__init__.py",
            "gui/main_window.py",
            "core/__init__.py",
            "core/paths.py",
            "engines/__init__.py",
            "assets/icon.ico",
            "assets/icon.png"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required project file: $file"
            }
          }

          Write-Host "Project structure verified."

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 5. Prepare directories
      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, models | Out-Null

      # 6. Download FFmpeg and FFprobe
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force

          Get-ChildItem ffmpeg_tmp -Recurse -File |
            Where-Object {
              $_.Name -in @("ffmpeg.exe", "ffprobe.exe")
            } |
            ForEach-Object {
              Copy-Item $_.FullName bin/ -Force
            }

          if (!(Test-Path "bin/ffmpeg.exe")) {
            throw "FFmpeg not found."
          }

          if (!(Test-Path "bin/ffprobe.exe")) {
            throw "FFprobe not found."
          }

          Write-Host "FFmpeg and FFprobe ready."

      # 7. Download RIFE
      - name: Download RIFE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            "https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip" `
            -OutFile rife.zip

          Expand-Archive rife.zip -DestinationPath models -Force

          $rife = Get-ChildItem models -Recurse -Filter "rife-ncnn-vulkan.exe" |
            Select-Object -First 1

          if (-not $rife) {
            throw "RIFE executable not found."
          }

          Write-Host "RIFE ready: $($rife.FullName)"

      # 8. Build application
      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pyArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--name", "Flowframes-TikTok60FPS-Studio",

            "--paths", ".",

            "--icon", "assets/icon.ico",

            "--add-data", "assets;assets",
            "--add-data", "bin;bin",
            "--add-data", "models;models",

            "--collect-all", "customtkinter",

            "--collect-submodules", "gui",
            "--collect-submodules", "core",
            "--collect-submodules", "engines"
          )

          pyinstaller @pyArgs main.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller build failed."
          }

          if (!(Test-Path "dist/Flowframes-TikTok60FPS-Studio/Flowframes-TikTok60FPS-Studio.exe")) {
            throw "Application EXE was not generated."
          }

          Write-Host "Build completed successfully."

      # 9. Package application
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/Flowframes-TikTok60FPS-Studio" `
            -DestinationPath "Flowframes-TikTok60FPS-Studio-win64.zip" `
            -CompressionLevel Optimal

      # 10. Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowframes-TikTok60FPS-Studio-win64
          path: Flowframes-TikTok60FPS-Studio-win64.zip
          if-no-files-found: error
          retention-days: 30

      # 11. Publish GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flowframes-TikTok60FPS-Studio-win64.zip
          generate_release_notes: true
